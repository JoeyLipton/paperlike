name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # An older Ubuntu keeps the glibc requirement low.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the version and release notes
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version" >&2
            exit 1
          fi
          # The notes are this version's section of the changelog.
          awk -v v="$version" '$1 == "##" { if (f) exit; f = ($2 == v); next } f' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Install toolchain
        run: rustup toolchain install

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          name="paperlike-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/$name/licenses"
          cp target/release/paperlike README.md doc/paperlike.1 assets/paperlike.desktop "dist/$name/"
          cp LICENSE-MIT LICENSE-APACHE assets/fonts/*.txt "dist/$name/licenses/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
