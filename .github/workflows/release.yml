name: Release

on:
  push:
    tags: ["v*"]
  # Builds the binaries an existing release is missing (say, for an
  # architecture added later). Binaries already attached are left alone.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.3.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check the version and release notes
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG doesn't match Cargo.toml version $version" >&2
            exit 1
          fi
          # The notes are this version's section of the changelog.
          awk -v v="$version" '$1 == "##" { if (f) exit; f = ($2 == v); next } f' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      # A draft stays hidden until every binary is attached.
      - name: Create the release as a draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md

  build:
    needs: create
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    # An older Ubuntu keeps the glibc requirement low.
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: paperlike-${{ inputs.tag || github.ref_name }}-${{ matrix.arch }}-linux
    steps:
      - name: Skip if this binary is already attached
        id: existing
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null \
              | grep -qx "$NAME.tar.gz"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.existing.outputs.skip != 'true'
        with:
          ref: ${{ env.TAG }}

      - name: Install toolchain
        if: steps.existing.outputs.skip != 'true'
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install

      - name: Build
        if: steps.existing.outputs.skip != 'true'
        run: cargo build --release --locked

      - name: Smoke test
        if: steps.existing.outputs.skip != 'true'
        run: |
          target/release/paperlike version
          target/release/paperlike preview smoke matte --size 64x64
          test -s smoke/matte-light.ppm

      - name: Package
        if: steps.existing.outputs.skip != 'true'
        run: |
          mkdir -p "dist/$NAME/licenses"
          cp target/release/paperlike README.md doc/paperlike.1 assets/paperlike.desktop "dist/$NAME/"
          cp LICENSE-MIT LICENSE-APACHE assets/fonts/*.txt "dist/$NAME/licenses/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")

      - name: Upload
        if: steps.existing.outputs.skip != 'true'
        run: gh release upload "$TAG" "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256"

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest
